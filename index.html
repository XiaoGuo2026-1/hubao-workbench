<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#dcecfb">
<title>虎宝的工作台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* ============ 虎宝的工作台 · ins蓝粉紫柔和风 ============ */
:root{
  --blue:#aecff5; --blue-l:#e3effc; --blue-d:#6f9fd8;
  --pink:#f6c9d8; --pink-l:#fdeef4; --pink-d:#e295b4;
  --purple:#cfc3ef; --purple-l:#f0ebfb; --purple-d:#9c86d8;
  --mint:#c6e8dd; --mint-l:#eafaf4;
  --cream:#fff9ee; --yellow:#f9e1a8;
  --text:#5a5670; --text-light:#9a94b3;
  --bg:#f6f6fc; --card:#ffffff;
  --radius:22px; --radius-s:14px;
  --shadow:0 6px 20px rgba(150,140,200,.13);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{
  font-family:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#eef4fd 0%,#fdf1f6 55%,#f1edfb 100%);
  min-height:100vh;color:var(--text);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;outline:none}

/* ---------- 顶部栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:50;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(175,160,220,.15);
}
.menu-btn{
  width:40px;height:40px;border-radius:14px;font-size:20px;
  background:linear-gradient(135deg,var(--blue-l),var(--purple-l));
  color:var(--purple-d);box-shadow:0 2px 8px rgba(150,140,200,.15);
}
.topbar-title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;color:#7a6fb0}
.logo-emoji{font-size:22px}
.topbar-date{margin-left:auto;font-size:12px;color:var(--text-light);text-align:right;line-height:1.3}

/* ---------- 侧边栏 ---------- */
.mask{position:fixed;inset:0;background:rgba(90,80,130,.28);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.mask.show{opacity:1;pointer-events:auto}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:236px;z-index:70;
  background:linear-gradient(180deg,#fdfcff 0%,#f3f0fc 100%);
  border-radius:0 28px 28px 0;box-shadow:8px 0 30px rgba(120,100,180,.12);
  transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,.9,.4,1);
  display:flex;flex-direction:column;padding:20px 14px;
}
.sidebar.open{transform:translateX(0)}
.side-head{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:2px dashed #e5def5;margin-bottom:14px}
.side-avatar{
  width:52px;height:52px;border-radius:18px;font-size:28px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--yellow),var(--pink));
  box-shadow:var(--shadow);
}
.side-name{font-weight:700;font-size:15px;color:#6d63a8}
.side-date{font-size:11px;color:var(--text-light);margin-top:3px}
.side-nav{display:flex;flex-direction:column;gap:8px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  border-radius:18px;font-size:15px;font-weight:600;color:#8a83a8;
  transition:.2s;text-align:left;
}
.nav-item .nav-text{flex:1}
.nav-item.active{
  background:linear-gradient(135deg,var(--blue-l),var(--pink-l));
  color:#6d63a8;box-shadow:0 3px 12px rgba(150,140,200,.18);
  transform:translateX(4px);
}
.nav-badge{font-size:10px;background:var(--pink);color:#fff;border-radius:20px;padding:2px 7px;min-width:20px;text-align:center}
.nav-badge:empty{display:none}
.side-foot{font-size:12px;color:var(--text-light);text-align:center;padding-top:12px}

/* 赛罗奥特曼小图标（SVG容器） */
.zero-icon{width:34px;height:34px;display:inline-flex;flex-shrink:0}
.zero-icon svg{width:100%;height:100%}

/* ---------- 主体 ---------- */
.main{padding:70px 14px 30px;max-width:560px;margin:0 auto}
.page{display:none;animation:fadeUp .3s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 页面头部卡片 */
.page-hero{
  border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero-blue{background:linear-gradient(135deg,#dcecfb,#eef6ff)}
.hero-pink{background:linear-gradient(135deg,#fbdfe9,#fdf1f6)}
.hero-purple{background:linear-gradient(135deg,#e4dcf7,#f3eefc)}
.hero-mint{background:linear-gradient(135deg,#d5f0e5,#eefaf5)}
.hero-yellow{background:linear-gradient(135deg,#fbeccc,#fdf7ea)}
.page-hero h2{font-size:19px;color:#6d63a8;display:flex;align-items:center;gap:8px}
.page-hero .hero-sub{font-size:12px;color:var(--text-light);margin-top:6px}
.hero-deco{position:absolute;right:12px;top:10px;font-size:38px;opacity:.5}

/* 进度条 */
.progress-wrap{margin-top:12px}
.progress-label{font-size:12px;color:#8a83a8;margin-bottom:6px;font-weight:600}
.progress-bar{height:12px;border-radius:10px;background:rgba(255,255,255,.7);overflow:hidden}
.progress-fill{
  height:100%;border-radius:10px;width:0;transition:width .4s ease;
  background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));
}

/* 通用卡片 */
.card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  margin-bottom:14px;box-shadow:var(--shadow);
}
.card-title{
  font-size:15px;font-weight:700;color:#6d63a8;
  display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;
}
.card-title .t-emoji{font-size:20px}
.card-title .t-time{font-size:11px;font-weight:600;color:#fff;background:var(--blue);border-radius:20px;padding:2px 9px}
.card-body{font-size:14px;line-height:1.9;color:var(--text)}

/* 喇叭按钮 */
.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-size:15px;vertical-align:middle;
  background:linear-gradient(135deg,var(--pink-l),var(--purple-l));
  box-shadow:0 2px 6px rgba(150,140,200,.2);margin-left:6px;transition:.15s;
}
.spk:active{transform:scale(.85)}
.spk.playing{background:linear-gradient(135deg,var(--pink),var(--purple));animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* 跳转链接按钮 */
.link-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.link-btn{
  font-size:12px;padding:6px 12px;border-radius:20px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;text-decoration:none;
}
.link-bili{background:#e3effc;color:#4a86c8}
.link-douyin{background:#fdeef4;color:#d8749c}
.link-web{background:#f0ebfb;color:#8d76cc}

/* ---------- 任务清单 ---------- */
.task-add{display:flex;gap:8px;margin-bottom:12px}
.task-add input{
  flex:1;border:2px solid #ece7f8;border-radius:16px;padding:10px 14px;
  font-size:14px;background:#fbfaff;color:var(--text);
}
.task-add input::placeholder{color:#c3bdd8}
.task-add button{
  padding:0 18px;border-radius:16px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue-d),var(--purple-d));
  box-shadow:0 3px 10px rgba(140,120,210,.3);
}
.task-list{display:flex;flex-direction:column;gap:9px}
.task-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:#fbfaff;border:1.5px solid #efeaf9;border-radius:16px;transition:.2s;
}
.task-item.done{background:#f4f3f7;opacity:.65}
.task-item.done .task-text{text-decoration:line-through;color:#b4aec9}
.task-check{
  width:24px;height:24px;border-radius:9px;border:2px solid var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:#fff;flex-shrink:0;transition:.15s;background:#fff;
}
.task-item.done .task-check{background:linear-gradient(135deg,var(--purple),var(--pink));border-color:transparent}
.task-text{flex:1;font-size:14px;line-height:1.4}
.task-tag{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700;flex-shrink:0}
.tag-chinese{background:var(--pink-l);color:var(--pink-d)}
.tag-math{background:var(--blue-l);color:var(--blue-d)}
.tag-english{background:var(--purple-l);color:var(--purple-d)}
.tag-games{background:var(--mint-l);color:#5cab8d}
.tag-plan{background:var(--cream);color:#cfa146}
.task-pri{font-size:16px;flex-shrink:0;opacity:.35;transition:.15s}
.task-pri.on{opacity:1}
.task-del{font-size:15px;color:#d9d3ea;flex-shrink:0;padding:3px}
.task-del:active{color:var(--pink-d)}
.empty-tip{text-align:center;font-size:13px;color:var(--text-light);padding:16px}

/* ---------- 内容展示 ---------- */
.poem-box{text-align:center;padding:8px 0}
.poem-title{font-size:18px;font-weight:700;color:#6d63a8}
.poem-author{font-size:12px;color:var(--text-light);margin:4px 0 10px}
.poem-line{font-size:16px;line-height:2.1;letter-spacing:2px}

.hanzi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hanzi-cell{
  background:linear-gradient(135deg,#fbfaff,#f3f0fc);border-radius:14px;
  padding:9px 2px;text-align:center;border:1.5px solid #eee8fa;
}
.hanzi-py{font-size:11px;color:var(--purple-d)}
.hanzi-ch{font-size:24px;font-weight:700;color:#5a5670;line-height:1.3}

.pinyin-row{display:flex;flex-wrap:wrap;gap:8px}
.pinyin-chip{
  background:linear-gradient(135deg,var(--pink-l),var(--purple-l));
  border-radius:16px;padding:8px 14px;font-size:14px;font-weight:700;color:#8d76cc;
  display:flex;align-items:center;gap:4px;
}
.spell-line{background:#fbfaff;border-radius:14px;padding:9px 14px;margin-top:8px;font-size:15px;font-weight:600;color:#6d63a8;display:flex;align-items:center;justify-content:space-between}

.quiz-box{background:#fbfaff;border-radius:16px;padding:14px;margin-top:10px}
.quiz-q{font-size:15px;font-weight:700;margin-bottom:10px;color:#6d63a8}
.quiz-q .big{font-size:30px;margin:0 6px}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap}
.quiz-opt{
  min-width:64px;padding:10px 16px;border-radius:16px;font-size:16px;font-weight:700;
  background:#fff;border:2px solid #e8e2f7;color:var(--text);transition:.15s;
}
.quiz-opt.right{background:var(--mint);border-color:#7cc9aa;color:#2c7d5c}
.quiz-opt.wrong{background:var(--pink-l);border-color:var(--pink-d);color:var(--pink-d)}
.quiz-feedback{font-size:13px;margin-top:8px;font-weight:600;min-height:18px}

.word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.word-card{
  background:linear-gradient(160deg,#fbfaff,#f0f4fd);border-radius:16px;
  padding:10px 4px;text-align:center;border:1.5px solid #e8eefb;
}
.word-emoji{font-size:30px}
.word-en{font-size:14px;font-weight:700;color:#4a86c8;margin-top:2px}
.word-zh{font-size:11px;color:var(--text-light)}
.word-card .spk{width:26px;height:26px;font-size:12px;margin:4px 0 0}

.sent-item{background:#fbfaff;border-radius:14px;padding:10px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sent-en{font-size:15px;font-weight:700;color:#6d63a8}
.sent-zh{font-size:12px;color:var(--text-light);margin-top:2px}

.num-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.num-ball{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff;box-shadow:0 3px 8px rgba(150,140,200,.25);
}
.story-text{font-size:14.5px;line-height:2;background:#fbfaff;border-radius:16px;padding:14px;text-indent:2em}

/* ---------- 游戏 ---------- */
.game-tabs{display:flex;gap:10px;margin-bottom:14px}
.game-tab{
  flex:1;padding:12px;border-radius:18px;font-size:14px;font-weight:700;
  background:#fff;color:#8a83a8;box-shadow:var(--shadow);transition:.2s;
}
.game-tab.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.match-card{
  aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--blue-l),var(--purple-l));
  color:transparent;box-shadow:var(--shadow);transition:.25s;border:2px solid transparent;
}
.match-card.flip{background:#fff;color:#6d63a8;border-color:var(--purple)}
.match-card.matched{background:var(--mint-l);color:#5cab8d;border-color:var(--mint);opacity:.7;transform:scale(.93)}
.game-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:700;color:#6d63a8}
.goose-area{
  position:relative;height:330px;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#dff0fd 0%,#eafaf4 100%);
  border:2px solid #d8e8f8;
}
.goose{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  transition:top .1s linear;cursor:pointer;user-select:none;
}
.goose .g-body{font-size:34px;animation:waddle 1s infinite}
.goose .g-item{
  font-size:22px;background:#fff;border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);
  margin-top:-6px;
}
@keyframes waddle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.goose-target{
  text-align:center;font-size:16px;font-weight:800;color:#4a86c8;
  padding:10px;background:#fff;border-radius:16px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);
}
.btn{
  padding:11px 26px;border-radius:20px;font-size:15px;font-weight:700;transition:.15s;
}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,var(--blue-d),var(--purple-d));color:#fff;box-shadow:0 4px 14px rgba(140,120,210,.35)}
.btn-pink{background:linear-gradient(135deg,var(--pink-d),var(--purple-d));color:#fff;box-shadow:0 4px 14px rgba(220,130,170,.35)}
.btn-ghost{background:#fff;color:#8d76cc;border:2px solid #e5def5}
.center{text-align:center}

/* ---------- 打卡 ---------- */
.checkin-hero{text-align:center;padding:24px 16px}
.checkin-big{font-size:56px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.checkin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--blue-d),var(--pink-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-label{font-size:11px;color:var(--text-light);margin-top:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-head{font-size:11px;color:var(--text-light);text-align:center;font-weight:700}
.cal-day{
  aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:12px;background:#fbfaff;border:1px solid #f0ecfa;color:var(--text-light);
}
.cal-day.stamped{background:linear-gradient(135deg,var(--pink-l),var(--purple-l));color:var(--purple-d);font-weight:800}
.cal-day.today{border:2px solid var(--blue-d);font-weight:800;color:var(--blue-d)}
.cal-day.empty{background:transparent;border:none}
.reset-btn{font-size:12px;color:#c3bdd8;text-decoration:underline;margin-top:14px}

/* ---------- 庆祝 ---------- */
.celebrate{position:fixed;inset:0;z-index:100;background:rgba(90,80,130,.4);display:none;align-items:center;justify-content:center}
.celebrate.show{display:flex}
.celebrate-box{background:#fff;border-radius:26px;padding:30px 36px;text-align:center;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.celebrate-emoji{font-size:52px}
.celebrate-text{font-size:17px;font-weight:700;color:#6d63a8;margin:12px 0 18px}

/* 大屏适配：侧边栏常驻 */
@media(min-width:820px){
  .sidebar{transform:translateX(0)}
  .mask{display:none}
  .menu-btn{visibility:hidden}
  .main{margin-left:236px;max-width:640px}
  .topbar{left:236px}
}

</style>
</head>
<body>
<!-- 顶部栏 -->
<header class="topbar">
  <button id="menuBtn" class="menu-btn" aria-label="菜单">☰</button>
  <div class="topbar-title">
    <span class="logo-emoji">🐯</span>
    <span>虎宝的工作台</span>
  </div>
  <div id="topDate" class="topbar-date"></div>
</header>

<!-- 遮罩 -->
<div id="mask" class="mask"></div>

<!-- 左侧弹出侧边导航 -->
<aside id="sidebar" class="sidebar">
  <div class="side-head">
    <div class="side-avatar">🐯</div>
    <div>
      <div class="side-name">虎宝小朋友</div>
      <div id="sideDate" class="side-date"></div>
    </div>
  </div>
  <nav class="side-nav" id="sideNav">
    <button class="nav-item active" data-page="plan">
      <span class="nav-icon zero-icon" data-form="beyond"></span>
      <span class="nav-text">每日计划</span><span class="nav-badge" id="badge-plan"></span>
    </button>
    <button class="nav-item" data-page="chinese">
      <span class="nav-icon zero-icon" data-form="zero"></span>
      <span class="nav-text">语文</span><span class="nav-badge" id="badge-chinese"></span>
    </button>
    <button class="nav-item" data-page="math">
      <span class="nav-icon zero-icon" data-form="corona"></span>
      <span class="nav-text">数学</span><span class="nav-badge" id="badge-math"></span>
    </button>
    <button class="nav-item" data-page="english">
      <span class="nav-icon zero-icon" data-form="luna"></span>
      <span class="nav-text">英语</span><span class="nav-badge" id="badge-english"></span>
    </button>
    <button class="nav-item" data-page="games">
      <span class="nav-icon zero-icon" data-form="shining"></span>
      <span class="nav-text">趣味学习游戏</span><span class="nav-badge" id="badge-games"></span>
    </button>
    <button class="nav-item" data-page="checkin">
      <span class="nav-icon zero-icon" data-form="ultimate"></span>
      <span class="nav-text">打卡</span><span class="nav-badge" id="badge-checkin"></span>
    </button>
  </nav>
  <div class="side-foot">🌈 每天进步一点点</div>
</aside>

<!-- 主体内容 -->
<main class="main">
  <section id="page-plan" class="page active"></section>
  <section id="page-chinese" class="page"></section>
  <section id="page-math" class="page"></section>
  <section id="page-english" class="page"></section>
  <section id="page-games" class="page"></section>
  <section id="page-checkin" class="page"></section>
</main>

<!-- 庆祝弹层 -->
<div id="celebrate" class="celebrate">
  <div class="celebrate-box">
    <div class="celebrate-emoji">🎉</div>
    <div id="celebrateText" class="celebrate-text">太棒啦！</div>
    <button class="btn btn-primary" onclick="hideCelebrate()">继续加油</button>
  </div>
</div>

<script>
/* ============ 虎宝的工作台 · 学习素材库（每日自动轮换） ============ */

/* 古诗（每日1首） */
const POEMS=[
{t:"咏鹅",a:"骆宾王",l:["鹅，鹅，鹅，","曲项向天歌。","白毛浮绿水，","红掌拨清波。"]},
{t:"静夜思",a:"李白",l:["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"]},

const IDIOMS=[
{n:"守株待兔",s:"从前有个农夫，看见一只兔子撞在树桩上死了。他就天天守在树桩旁等兔子，再也不种田了。结果田荒了，兔子也没等到。小朋友，做事情要靠自己努力，不能光等运气哦！"},
{n:"拔苗助长",s:"有个人嫌禾苗长得太慢，就把苗一棵棵往上拔。回家告诉家人苗长高了，儿子跑去一看，苗全枯死了。做事情要有耐心，不能着急哦！"},
{n:"亡羊补牢",s:"牧民的羊圈破了个洞，狼叼走了一只羊。邻居劝他修补，他不听，第二天又丢了一只。他赶紧把洞补好，从此再也没丢过羊。发现错误及时改正，就不算晚！"},
{n:"画蛇添足",s:"几个人比赛画蛇，先画完的人得意地给蛇添上了脚，结果别人画完说：蛇本来没有脚呀！他反而输了。做多余的事情，反而会坏事哦！"},
{n:"井底之蛙",s:"一只青蛙住在井底，以为天空只有井口那么大。小鸟告诉它天空无边无际，它却不相信。我们要多看看外面的世界，不能眼界太小哦！"},
{n:"狐假虎威",s:"狐狸被老虎抓住，骗老虎说自己是百兽之王。老虎跟在狐狸后面走，动物们看见老虎都吓跑了，老虎还以为大家真的怕狐狸呢！借别人的力量吓唬人，可不是真本事！"},
{n:"刻舟求剑",s:"有人坐船时剑掉进江里，他在船边刻了个记号，说等船靠岸再从记号处下水找剑。可是船在动，剑不动，怎么能找到呢？要用变化的眼光看问题哦！"},
{n:"掩耳盗铃",s:"小偷想偷大钟，怕钟声被人听见，就捂住自己的耳朵去砸钟。他以为自己听不见，别人也听不见，结果被抓住啦！自己骗自己，是没有用的！"},
{n:"自相矛盾",s:"有人卖矛又卖盾，说他的盾什么都刺不破，又说他的矛什么都能刺破。有人问：用你的矛刺你的盾会怎样？他答不上来了。说话做事要前后一致哦！"},
{n:"对牛弹琴",s:"音乐家对着牛弹了一首优美的曲子，牛只顾低头吃草。后来他弹出蚊子和小牛的叫声，牛才竖起耳朵听。说话要看对象，用别人听得懂的方式哦！"},
{n:"叶公好龙",s:"叶公特别喜欢龙，家里到处画着龙。真龙听说后来看他，叶公却吓得逃跑了。原来他喜欢的是假龙呀！喜欢一样东西，要真心喜欢哦！"},

/* ---------- 日期与每日种子 ---------- */
const now=new Date();
const pad=n=>String(n).padStart(2,"0");
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const DAY_IDX=Math.floor(now.getTime()/86400000+now.getTimezoneOffset()/1440*-0+0)% 100000;
const WEEK=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][now.getDay()];
function pick(arr,offset=0){return arr[(DAY_IDX+offset)%arr.length];}
function pickN(arr,n,step=1){const out=[];for(let i=0;i<n;i++)out.push(arr[(DAY_IDX*n*step+i)%arr.length]);return out;}
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>((s=s*16807%2147483647)-1)/2147483646;}
const rand=rng(DAY_IDX+7);

/* ---------- 语音朗读 (TTS) ---------- */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
loadVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
function speak(text,lang="zh-CN",btn){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;u.rate=lang.startsWith("en")?0.85:0.9;u.pitch=1.1;
    const v=voices.find(v=>v.lang.replace("_","-").startsWith(lang))||voices.find(v=>v.lang.startsWith(lang.slice(0,2)));
    if(v)u.voice=v;
    if(btn){btn.classList.add("playing");u.onend=()=>btn.classList.remove("playing");u.onerror=()=>btn.classList.remove("playing");}
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 任务引擎 ---------- */
function getTasks(subj){
  const dels=delList();
  const defs=(DEFAULT_TASKS[subj]||[]).filter(t=>!dels.includes(t.id)).map(t=>({...t,subj,def:true}));
  const cus=(DB.custom[subj]||[]).filter(t=>!dels.includes(t.id)).map(t=>({...t,subj,def:false}));
  return defs.concat(cus);
}
function allTasks(){return["chinese","math","english","games","plan"].flatMap(getTasks);}
function isDone(id){return !!dayObj("checks")[id];}
function toggleTask(id){const c=dayObj("checks");c[id]=!c[id];if(!c[id])delete c[id];save();refresh();
  const all=allTasks();if(all.length&&all.every(t=>isDone(t.id)))showCelebrate("今天的任务全部完成啦！\n快去打卡页面盖章吧！🎖️");}
function togglePri(id){const p=dayObj("pri");p[id]=!p[id];if(!p[id])delete p[id];save();refresh();}
function delTask(id){delList().push(id);save();refresh();}
function addTask(subj,inputId){
  const inp=document.getElementById(inputId);const v=inp.value.trim();if(!v)return;
  if(!DB.custom[subj])DB.custom[subj]=[];
  DB.custom[subj].push({id:"c"+Date.now(),text:v});inp.value="";save();refresh();
}
function stats(list){const d=list.filter(t=>isDone(t.id)).length;return{d,t:list.length,p:list.length?Math.round(d/list.length*100):0};}

/* ---------- 任务清单渲染 ---------- */
function taskListHTML(list,showTag){
  if(!list.length)return `<div class="empty-tip">还没有任务，快添加一个吧 ✨</div>`;
  const sorted=[...list].sort((a,b)=>(dayObj("pri")[b.id]?1:0)-(dayObj("pri")[a.id]?1:0));
  return `<div class="task-list">`+sorted.map(t=>{
    const done=isDone(t.id),pri=dayObj("pri")[t.id];
    return `<div class="task-item ${done?"done":""}">
      <button class="task-check" onclick="toggleTask('${t.id}')">${done?"✔":""}</button>
      <span class="task-text">${t.text}</span>
      ${showTag?`<span class="task-tag tag-${t.subj}">${SUBJECTS[t.subj]}</span>`:""}
      <button class="task-pri ${pri?"on":""}" onclick="togglePri('${t.id}')" title="优先级">⭐</button>
      <button class="task-del" onclick="delTask('${t.id}')">✖</button>
    </div>`;}).join("")+`</div>`;
}
function addBoxHTML(subj){
  return `<div class="task-add">
    <input id="add-${subj}" placeholder="输入新任务，例如：练习写名字" onkeydown="if(event.key==='Enter')addTask('${subj}','add-${subj}')">

}

function calendarHTML(){
  const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=["日","一","二","三","四","五","六"].map(d=>`<div class="cal-head">${d}</div>`).join("");
  for(let i=0;i<first;i++)h+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const cls=(DB.checkins[ds]?"stamped":"")+(ds===TODAY?" today":"");
    h+=`<div class="cal-day ${cls}">${DB.checkins[ds]?"🌟":d}</div>`;

/* ============ 虎宝的工作台 · 趣味学习游戏 ============ */
let GAME="match";
function switchGame(g){GAME=g;renderGames();}

function renderGames(){
  const st=stats(getTasks("games"));
  document.getElementById("page-games").innerHTML=
    heroHTML("hero-mint","🎮",`<span class="zero-icon" data-form="shining"></span> 趣味学习游戏`,`${TODAY} ${WEEK} · 边玩边学更快乐`,st)+
    `<div class="card"><div class="card-title"><span class="t-emoji">✅</span>今日游戏任务</div>${addBoxHTML("games")}${taskListHTML(getTasks("games"))}</div>`+
    `<div class="game-tabs">
      <button class="game-tab ${GAME==="match"?"active":""}" onclick="switchGame('match')">🀄 拼音对对碰</button>
      <button class="game-tab ${GAME==="goose"?"active":""}" onclick="switchGame('goose')">🦢 英语抓大鹅</button></div>
    <div class="card" id="gameArea"></div>`;
  paintIcons();
  if(GAME==="match")initMatch();else initGoose();
}

/* ---------- 游戏1：拼音汉字对对碰 ---------- */
let mLevel=1,mFirst=null,mLock=false,mLeft=0,mPairs=[];
function initMatch(){
  mFirst=null;mLock=false;
  const start=(DAY_IDX*10+(mLevel-1)*6)%HANZI.length;
  mPairs=[];for(let i=0;i<6;i++)mPairs.push(HANZI[(start+i)%HANZI.length]);
  mLeft=6;
  let cards=[];
  mPairs.forEach((p,i)=>{cards.push({v:p[0],k:i,type:"ch"});cards.push({v:p[1],k:i,type:"py"});});
  cards.sort(()=>Math.random()-0.5);
  document.getElementById("gameArea").innerHTML=
    `<div class="game-info"><span>🚩 第 ${mLevel} 关</span><span>找到 <b id="mLeft">${mLeft}</b> 对拼音和汉字</span>
     ${spkBtn("翻开卡片，把拼音和汉字配成一对吧！")}</div>
     <div class="match-grid">${cards.map((c,i)=>`<button class="match-card" id="mc${i}" data-k="${c.k}" data-v="${c.v}" data-t="${c.type}" onclick="flipCard(${i})">${c.v}</button>`).join("")}</div>
     <div class="center" style="margin-top:12px"><button class="btn btn-ghost" onclick="initMatch()">🔄 重新开始</button></div>`;
}
function flipCard(i){
  if(mLock)return;
  const el=document.getElementById("mc"+i);
  if(el.classList.contains("flip")||el.classList.contains("matched"))return;
  el.classList.add("flip");
  speak(el.dataset.t==="ch"?el.dataset.v:mPairs[el.dataset.k][0]);
  if(!mFirst){mFirst=el;return;}
  const a=mFirst,b=el;mFirst=null;
  if(a.dataset.k===b.dataset.k){
    a.classList.add("matched");b.classList.add("matched");
    mLeft--;document.getElementById("mLeft").innerText=mLeft;
    if(mLeft===0){
      setTimeout(()=>{
        if(mLevel<3){mLevel++;showCelebrate(`第 ${mLevel-1} 关通关！🎉\n进入第 ${mLevel} 关！`);initMatch();}
        else{mLevel=1;showCelebrate("三关全部通关！🏆\n虎宝是拼音小达人！");initMatch();}
      },400);
    }
  }else{
    mLock=true;
    setTimeout(()=>{a.classList.remove("flip");b.classList.remove("flip");mLock=false;},700);
  }
}

/* ---------- 游戏2：英语抓大鹅 ---------- */
let gScore=0,gTarget=null,gTimer=null,gGeese=[];
function initGoose(){
  gScore=0;
  document.getElementById("gameArea").innerHTML=
    `<div class="game-info"><span>🏅 得分：<b id="gScore">0</b> / 10</span>
     ${spkBtn("听单词，抓住背着正确图案的大鹅！")}</div>
     <div class="goose-target" id="gTargetBox"></div>
     <div class="goose-area" id="gooseArea"></div>
     <div class="center" style="margin-top:12px"><button class="btn btn-ghost" onclick="initGoose()">🔄 重新开始</button></div>`;
  nextGooseRound();
}
function nextGooseRound(){
  if(gTimer)clearInterval(gTimer);
  const area=document.getElementById("gooseArea");
  if(!area)return;
  area.innerHTML="";gGeese=[];
  const words=M.en.w;
  gTarget=words[Math.floor(Math.random()*words.length)];
  document.getElementById("gTargetBox").innerHTML=
    `抓住背着 <span style="font-size:20px;color:#e295b4">${gTarget[0]}</span> 的大鹅！
     <button class="spk" onclick="spk(this,'${gTarget[0]}','en-US')">🔊</button>`;
  speak(gTarget[0],"en-US");
  /* 生成3只大鹅：1只正确 + 2只干扰 */
  const pool=[gTarget];
  while(pool.length<3){const w=words[Math.floor(Math.random()*words.length)];if(!pool.includes(w))pool.push(w);}
  pool.sort(()=>Math.random()-0.5);
  pool.forEach((w,i)=>{
    const g=document.createElement("div");
    g.className="goose";
    g.innerHTML=`<div class="g-body">🦢</div><div class="g-item">${w[2]}</div>`;
    g.style.left=(5+i*32)+"%";
    g.style.top=(Math.random()*70)+"%";
    g.dataset.dir=Math.random()>0.5?1:-1;
    g.onclick=()=>catchGoose(w,g);
    area.appendChild(g);gGeese.push(g);
  });
  gTimer=setInterval(()=>{
    gGeese.forEach(g=>{
      let t=parseFloat(g.style.top),d=parseFloat(g.dataset.dir);
      t+=d*(1.5+Math.random()*2);
      if(t>78){t=78;g.dataset.dir=-1;}if(t<2){t=2;g.dataset.dir=1;}
      g.style.top=t+"%";
    });
  },120);
}
function catchGoose(w,el){
  if(w===gTarget){
    gScore++;
    el.querySelector(".g-body").innerText="💥";
    speak("Great! "+w[0],"en-US");
    const s=document.getElementById("gScore");if(s)s.innerText=gScore;
    setTimeout(()=>{
      if(gScore>=10){clearInterval(gTimer);showCelebrate("抓到10只大鹅！🏆\n虎宝是单词小猎手！");initGoose();}
      else nextGooseRound();
    },500);
  }else{
    el.style.opacity=.4;
    speak("Try again!","en-US");
    setTimeout(()=>el.style.opacity=1,600);
  }
}

</script>
